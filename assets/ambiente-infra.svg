<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="1020" height="760" role="img" aria-label="Diagrama de alto nivel do ambiente de infraestrutura" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg    { fill: #0F1317; }
      .panel { fill: #171C22; stroke: #262E36; stroke-width: 1; }
      .rail  { fill: #141A20; stroke: #262E36; stroke-width: 1; }
      .pill  { fill: #1E252C; stroke: #2E3841; stroke-width: 1; }
      .edge  { fill: #5B8CA8; }
      .edgeAcc { fill: #E0A33D; }
      .t     { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .h1    { font-size: 21px; font-weight: 600; fill: #E4EAEF; letter-spacing: .2px; }
      .sub   { font-size: 13px; font-weight: 400; fill: #7E8B96; }
      .layer { font-size: 13.5px; font-weight: 600; fill: #C6D1DA; }
      .item  { font-size: 12px; font-weight: 400; fill: #AEB9C4; }
      .railt { font-size: 12.5px; font-weight: 600; fill: #E0A33D; }
      .railq { font-size: 12.5px; font-weight: 600; fill: #C6D1DA; }
      .note  { font-size: 11px; font-weight: 400; fill: #66727C; }
      .link  { stroke: #39434D; stroke-width: 1; }
      .flow  { stroke: #46525E; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1020" height="760"/>

  <!-- cabecalho -->
  <text class="t h1" x="24" y="40">Ambiente de infraestrutura</text>
  <text class="t sub" x="24" y="62">Visão de alto nível do escopo que administro: indústria multinacional, operação brasileira</text>
  <line class="link" x1="24" y1="76" x2="996" y2="76"/>

  <!-- ============ trilha esquerda: observabilidade ============ -->
  <rect class="rail" x="24" y="96" width="152" height="546" rx="4"/>
  <rect class="edgeAcc" x="24" y="96" width="3" height="546" rx="1.5"/>
  <text class="t railt" x="40" y="122">Observabilidade</text>
  <line class="link" x1="40" y1="132" x2="160" y2="132"/>

  <rect class="pill" x="40" y="148" width="120" height="30" rx="4"/>
  <text class="t item" x="100" y="167" text-anchor="middle">Zabbix</text>
  <rect class="pill" x="40" y="186" width="120" height="30" rx="4"/>
  <text class="t item" x="100" y="205" text-anchor="middle">Grafana</text>
  <rect class="pill" x="40" y="224" width="120" height="30" rx="4"/>
  <text class="t item" x="100" y="243" text-anchor="middle">Dashboards</text>
  <rect class="pill" x="40" y="262" width="120" height="30" rx="4"/>
  <text class="t item" x="100" y="281" text-anchor="middle">Alertas</text>
  <rect class="pill" x="40" y="300" width="120" height="30" rx="4"/>
  <text class="t item" x="100" y="319" text-anchor="middle">Gestão de hosts</text>

  <text class="t note" x="40" y="366">Coleta e alerta sobre</text>
  <text class="t note" x="40" y="382">todas as camadas ao</text>
  <text class="t note" x="40" y="398">lado, on-premises e</text>
  <text class="t note" x="40" y="414">em nuvem.</text>

  <!-- conectores tracejados para o centro -->
  <line x1="176" y1="176" x2="196" y2="176" stroke="#E0A33D" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
  <line x1="176" y1="284" x2="196" y2="284" stroke="#E0A33D" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
  <line x1="176" y1="400" x2="196" y2="400" stroke="#E0A33D" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
  <line x1="176" y1="500" x2="196" y2="500" stroke="#E0A33D" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
  <line x1="176" y1="596" x2="196" y2="596" stroke="#E0A33D" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>

  <!-- ============ camada 1: perimetro ============ -->
  <rect class="panel" x="196" y="96" width="628" height="94" rx="4"/>
  <rect class="edge" x="196" y="96" width="3" height="94" rx="1.5"/>
  <text class="t layer" x="212" y="124">Perímetro e acesso</text>
  <rect class="pill" x="212" y="140" width="168" height="32" rx="4"/>
  <text class="t item" x="296" y="160" text-anchor="middle">FortiGate (firewall)</text>
  <rect class="pill" x="392" y="140" width="146" height="32" rx="4"/>
  <text class="t item" x="465" y="160" text-anchor="middle">VPN site-to-site</text>
  <rect class="pill" x="550" y="140" width="176" height="32" rx="4"/>
  <text class="t item" x="638" y="160" text-anchor="middle">VPN de acesso remoto</text>

  <path class="flow" d="M510 190 L510 204"/>
  <path class="flow" d="M505 199 L510 205 L515 199"/>

  <!-- ============ camada 2: rede ============ -->
  <rect class="panel" x="196" y="206" width="628" height="94" rx="4"/>
  <rect class="edge" x="196" y="206" width="3" height="94" rx="1.5"/>
  <text class="t layer" x="212" y="234">Rede corporativa</text>
  <rect class="pill" x="212" y="250" width="144" height="32" rx="4"/>
  <text class="t item" x="284" y="270" text-anchor="middle">Cisco switching</text>
  <rect class="pill" x="368" y="250" width="88" height="32" rx="4"/>
  <text class="t item" x="412" y="270" text-anchor="middle">VLANs</text>
  <rect class="pill" x="468" y="250" width="198" height="32" rx="4"/>
  <text class="t item" x="567" y="270" text-anchor="middle">Meraki Wi-Fi corporativo</text>

  <path class="flow" d="M510 300 L510 314"/>
  <path class="flow" d="M505 309 L510 315 L515 309"/>

  <!-- ============ camada 3: datacenter ============ -->
  <rect class="panel" x="196" y="316" width="628" height="102" rx="4"/>
  <rect class="edge" x="196" y="316" width="3" height="102" rx="1.5"/>
  <text class="t layer" x="212" y="344">Servidores e dados</text>
  <rect class="pill" x="212" y="360" width="140" height="32" rx="4"/>
  <text class="t item" x="282" y="380" text-anchor="middle">VMware vSphere</text>
  <rect class="pill" x="364" y="360" width="184" height="32" rx="4"/>
  <text class="t item" x="456" y="380" text-anchor="middle">Windows Server e AD</text>
  <rect class="pill" x="560" y="360" width="112" height="32" rx="4"/>
  <text class="t item" x="616" y="380" text-anchor="middle">SQL Server</text>
  <rect class="pill" x="684" y="360" width="98" height="32" rx="4"/>
  <text class="t item" x="733" y="380" text-anchor="middle">MariaDB</text>

  <path class="flow" d="M510 418 L510 432"/>
  <path class="flow" d="M505 427 L510 433 L515 427"/>

  <!-- ============ camada 4: endpoints ============ -->
  <rect class="panel" x="196" y="434" width="628" height="102" rx="4"/>
  <rect class="edge" x="196" y="434" width="3" height="102" rx="1.5"/>
  <text class="t layer" x="212" y="462">Endpoints e proteção</text>
  <rect class="pill" x="212" y="478" width="146" height="32" rx="4"/>
  <text class="t item" x="285" y="498" text-anchor="middle">Microsoft Intune</text>
  <rect class="pill" x="370" y="478" width="172" height="32" rx="4"/>
  <text class="t item" x="456" y="498" text-anchor="middle">WSUS e update rings</text>
  <rect class="pill" x="554" y="478" width="162" height="32" rx="4"/>
  <text class="t item" x="635" y="498" text-anchor="middle">Microsoft Defender</text>
  <rect class="pill" x="728" y="478" width="86" height="32" rx="4"/>
  <text class="t item" x="771" y="498" text-anchor="middle">Bitdefender</text>

  <path class="flow" d="M510 536 L510 550"/>
  <path class="flow" d="M505 545 L510 551 L515 545"/>

  <!-- ============ camada 5: nuvem ============ -->
  <rect class="panel" x="196" y="552" width="628" height="90" rx="4"/>
  <rect class="edge" x="196" y="552" width="3" height="90" rx="1.5"/>
  <text class="t layer" x="212" y="580">Microsoft 365</text>
  <rect class="pill" x="212" y="596" width="146" height="32" rx="4"/>
  <text class="t item" x="285" y="616" text-anchor="middle">Exchange Online</text>
  <rect class="pill" x="370" y="596" width="186" height="32" rx="4"/>
  <text class="t item" x="463" y="616" text-anchor="middle">SharePoint e OneDrive</text>
  <rect class="pill" x="568" y="596" width="76" height="32" rx="4"/>
  <text class="t item" x="606" y="616" text-anchor="middle">Teams</text>
  <rect class="pill" x="656" y="596" width="158" height="32" rx="4"/>
  <text class="t item" x="735" y="616" text-anchor="middle">Security e Compliance</text>

  <!-- ============ trilha direita: continuidade ============ -->
  <rect class="rail" x="844" y="96" width="152" height="546" rx="4"/>
  <rect class="edge" x="844" y="96" width="3" height="546" rx="1.5"/>
  <text class="t railq" x="860" y="122">Continuidade</text>
  <line class="link" x1="860" y1="132" x2="980" y2="132"/>

  <rect class="pill" x="860" y="148" width="120" height="30" rx="4"/>
  <text class="t item" x="920" y="167" text-anchor="middle">Veeam Backup</text>
  <rect class="pill" x="860" y="186" width="120" height="46" rx="4"/>
  <text class="t item" x="920" y="205" text-anchor="middle">Testes de restore</text>
  <text class="t item" x="920" y="221" text-anchor="middle">e evidências</text>
  <rect class="pill" x="860" y="240" width="120" height="46" rx="4"/>
  <text class="t item" x="920" y="259" text-anchor="middle">Gestão de</text>
  <text class="t item" x="920" y="275" text-anchor="middle">mudanças</text>
  <rect class="pill" x="860" y="294" width="120" height="30" rx="4"/>
  <text class="t item" x="920" y="313" text-anchor="middle">Documentação</text>

  <text class="t note" x="860" y="366">Rotinas padronizadas</text>
  <text class="t note" x="860" y="382">de backup, restore</text>
  <text class="t note" x="860" y="398">validado e controle</text>
  <text class="t note" x="860" y="414">de mudança.</text>

  <line x1="824" y1="176" x2="844" y2="176" stroke="#46525E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="824" y1="284" x2="844" y2="284" stroke="#46525E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="824" y1="400" x2="844" y2="400" stroke="#46525E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="824" y1="500" x2="844" y2="500" stroke="#46525E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="824" y1="596" x2="844" y2="596" stroke="#46525E" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ============ base: governanca e suporte ============ -->
  <rect class="panel" x="24" y="658" width="972" height="72" rx="4"/>
  <rect class="edge" x="24" y="658" width="3" height="72" rx="1.5"/>
  <text class="t layer" x="40" y="682">Governança e suporte</text>
  <rect class="pill" x="248" y="666" width="192" height="30" rx="4"/>
  <text class="t item" x="344" y="685" text-anchor="middle">GLPI: chamados e inventário</text>
  <rect class="pill" x="452" y="666" width="96" height="30" rx="4"/>
  <text class="t item" x="500" y="685" text-anchor="middle">Bitwarden</text>
  <rect class="pill" x="560" y="666" width="132" height="30" rx="4"/>
  <text class="t item" x="626" y="685" text-anchor="middle">Fortics SZchat</text>
  <rect class="pill" x="704" y="666" width="146" height="30" rx="4"/>
  <text class="t item" x="777" y="685" text-anchor="middle">Telefonia GoTo</text>
  <rect class="pill" x="862" y="666" width="118" height="30" rx="4"/>
  <text class="t item" x="921" y="685" text-anchor="middle">Suporte N1 a N3</text>
  <text class="t note" x="40" y="716">Sem hostnames, endereçamento ou dados de ambiente.</text>
</svg>
