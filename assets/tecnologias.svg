<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" role="img" aria-label="Tecnologias com que trabalho" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg   { fill: #0F1317; }
      .t    { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .h1   { font-size: 22px; font-weight: 600; fill: #E8EEF3; letter-spacing: .2px; }
      .sub  { font-size: 13px; font-weight: 400; fill: #77848F; }
      .dom  { font-size: 13.5px; font-weight: 600; fill: #D3DCE4; }
      .item { font-size: 13px; font-weight: 400; fill: #A9B5C0; }
      .rule { stroke: #232B33; stroke-width: 1; }
      .tick { stroke: #2C353E; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1020" height="560"/>

  <!-- cabecalho -->
  <text class="t h1" x="32" y="52">Tecnologias</text>
