<svg xmlns="http://www.w3.org/2000/svg" width="920" height="402" viewBox="0 0 920 402" role="img" aria-label="Tecnologias que uso no dia a dia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .title  { font-size: 17px; font-weight: 600; fill: #e6edf3; }
    .sub    { font-size: 10.5px; fill: #8b949e; }
    .label  { font-size: 11.5px; font-weight: 600; fill: #e6edf3; }
    .item   { font-size: 11.5px; fill: #58a6ff; }
    .sep    { font-size: 11.5px; fill: #3d444d; }
    .rule   { stroke: #21262d; }
    .frame  { fill: none; stroke: #30363d; }
    .accent { fill: #58a6ff; }
    /* GitHub no tema claro */
    @media (prefers-color-scheme: light) {
      .title  { fill: #1f2328; }
      .sub    { fill: #59636e; }
      .label  { fill: #1f2328; }
      .item   { fill: #0969da; }
      .sep    { fill: #c8d1da; }
      .rule   { stroke: #d8dee4; }
      .frame  { stroke: #d0d7de; }
      .accent { fill: #0969da; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="919" height="401" rx="10" />
  <text class="title" x="24" y="30">Tecnologias</text>
  <text class="sub" x="24" y="50">Ferramentas e plataformas que uso no dia a dia como analista de infraestrutura</text>
  <rect x="24" y="60" width="42" height="2" rx="1" class="accent" />
  <line x1="24" y1="78" x2="896" y2="78" class="rule" />
  <text class="label" x="24" y="100.0">Servidores e virtualização</text>
  <text x="232" y="100.0"><tspan class="item">Windows Server</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Active Directory</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">VMware vSphere</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Debian</tspan></text>
  <line x1="24" y1="114" x2="896" y2="114" class="rule" />
  <text class="label" x="24" y="136.0">Containers e automação</text>
  <text x="232" y="136.0"><tspan class="item">Docker</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Docker Compose</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Portainer</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">PowerShell</tspan></text>
  <line x1="24" y1="150" x2="896" y2="150" class="rule" />
  <text class="label" x="24" y="172.0">Redes</text>
  <text x="232" y="172.0"><tspan class="item">Cisco switching</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Cisco Meraki</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">VLANs</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Wi-Fi corporativo</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">VPN</tspan></text>
  <line x1="24" y1="186" x2="896" y2="186" class="rule" />
  <text class="label" x="24" y="208.0">Segurança</text>
  <text x="232" y="208.0"><tspan class="item">FortiGate</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Microsoft Defender</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Bitdefender</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Bitwarden / Vaultwarden</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">ImmuniWeb</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Hacker Rangers</tspan></text>
  <line x1="24" y1="222" x2="896" y2="222" class="rule" />
  <text class="label" x="24" y="244.0">Monitoramento e backup</text>
  <text x="232" y="244.0"><tspan class="item">Zabbix</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Grafana</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Veeam Backup</tspan></text>
  <line x1="24" y1="258" x2="896" y2="258" class="rule" />
  <text class="label" x="24" y="280.0">Endpoints e Microsoft 365</text>
  <text x="232" y="280.0"><tspan class="item">Microsoft Intune</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">WSUS</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Exchange Online</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">SharePoint</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">OneDrive</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Teams</tspan></text>
  <line x1="24" y1="294" x2="896" y2="294" class="rule" />
  <text class="label" x="24" y="316.0">Bancos de dados</text>
  <text x="232" y="316.0"><tspan class="item">SQL Server</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">MariaDB</tspan></text>
  <line x1="24" y1="330" x2="896" y2="330" class="rule" />
  <text class="label" x="24" y="352.0">Operação e suporte</text>
  <text x="232" y="352.0"><tspan class="item">GLPI</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Snipe-IT</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">PaperCut Hive</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Fortics SZchat</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">GoTo</tspan></text>
  <line x1="24" y1="366" x2="896" y2="366" class="rule" />
  <text class="label" x="24" y="388.0">Produtividade com IA</text>
  <text x="232" y="388.0"><tspan class="item">Claude</tspan><tspan class="sep" dx="8">|</tspan><tspan class="sep" dx="8">|</tspan><tspan class="item" dx="8">Microsoft 365 Copilot</tspan></text>
</svg>
